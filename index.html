<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#159ee8">
  <meta name="description" content="Digital Plans Demo">

  <title>Digital Plans Demo</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #dca5f4, #f3c7ed);
      color: #32145f;
    }

    .screen {
      display: none;
      min-height: 100vh;
      padding: 25px 12px;
    }

    .screen.active {
      display: block;
    }

    .top-title {
      text-align: center;
      margin-bottom: 25px;
    }

    .top-title h1 {
      font-size: 34px;
      font-weight: 800;
    }

    .top-title p {
      margin-top: 6px;
      font-size: 17px;
    }

    /* दोनों कार्ड आमने-सामने */
    .plans {
      width: 100%;
      max-width: 1000px;
      margin: auto;
      display: flex;
      flex-direction: row;
      gap: 15px;
      justify-content: center;
    }

    .plan-card {
      width: 50%;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(70,20,100,.2);
      text-align: center;
      padding-bottom: 20px;
    }

    .plan-icon {
      width: 60px;
      height: 60px;
      margin: 18px auto 10px;
      border-radius: 50%;
      background: #673ab7;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
    }

    .plan-card h2 {
      font-size: 20px;
      margin: 10px 3px 15px;
    }

    .price {
      background: linear-gradient(90deg,#6518d7,#bd19df);
      color: white;
      font-size: 40px;
      font-weight: 900;
      padding: 17px 5px;
    }

    .features {
      text-align: left;
      padding: 20px 15px 8px;
    }

    .features p {
      font-size: 14px;
      margin-bottom: 13px;
    }

    .buy-btn,
    .next-btn,
    .home-btn {
      border: none;
      background: linear-gradient(90deg,#7020d5,#a81fe0);
      color: white;
      padding: 12px 22px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .buy-btn span,
    .next-btn span {
      font-size: 23px;
    }
